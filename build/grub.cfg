# usb-provision U 盘 grub 配置(BIOS + UEFI 通用)
set timeout=3
set default=0

# 关键:不设置 ipa-api-url,IPA 跳过 lookup/heartbeat,
# REST API 照常监听 127.0.0.1:9999,由本地编排器驱动。
#
# agent 配置(/etc/ironic-python-agent.d,IPA 以 --config-dir 方式读取)
# 由 usb-provision-config.service 在 IPA 启动前从 config-2 分区拷入。
# 注意:不使用 boot_method=vmedia —— IPA 原生 vmedia 配置拷贝机制
# (copy_config_from_vmedia)会排除含分区的设备,对分区式 U 盘不生效。
menuentry 'usb-provision installer' {
    search --no-floppy --file /boot/ipa-usb.kernel --set=root
    linux /boot/ipa-usb.kernel console=tty0 console=ttyS0,115200
    initrd /boot/ipa-usb.initramfs
}
